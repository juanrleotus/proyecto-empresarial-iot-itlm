# ============================================================
#  PROYECTO EMPRESARIAL IoT ITLM
#  Mosquitto 2.x  -  MODO B: CON USUARIO Y CONTRASENA
# ------------------------------------------------------------
#  USO: modo recomendado. Cada placa, Node-RED y la app del
#  celular se identifican con su propio usuario.
#
#  ANTES de usar este archivo hay que crear el archivo de
#  contrasenas:  ver  broker/README.md  (seccion 4)
# ============================================================

# ── 1. Escucha de red ───────────────────────────────────────
listener 1883 0.0.0.0
# (no agregar "bind_address": ver nota en mosquitto-sin-auth.conf)

# ── 2. Autenticacion ────────────────────────────────────────
allow_anonymous false

# Archivo de contrasenas generado con  mosquitto_passwd.
# Contiene los hash, NUNCA las claves en texto plano.
# Este archivo esta en .gitignore: no se sube al repositorio.
password_file C:/Program Files/mosquitto/passwd
# En Linux:  password_file /etc/mosquitto/passwd

# ── 3. Control de acceso por topico (ACL) ───────────────────
# Limita que puede publicar y leer cada usuario.
acl_file C:/Program Files/mosquitto/aclfile
# En Linux:  acl_file /etc/mosquitto/aclfile

# ── 4. Persistencia ─────────────────────────────────────────
persistence true
persistence_location C:/ProgramData/mosquitto/

# ── 5. Registro de sucesos ──────────────────────────────────
log_dest file C:/ProgramData/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# ── 6. Limites ──────────────────────────────────────────────
max_queued_messages 1000
message_size_limit 262144
