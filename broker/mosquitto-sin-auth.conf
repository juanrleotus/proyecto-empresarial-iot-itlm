# ============================================================
#  PROYECTO EMPRESARIAL IoT ITLM
#  Mosquitto 2.x  -  MODO A: SIN AUTENTICACION
# ------------------------------------------------------------
#  USO: solo laboratorio / aula, red local aislada.
#  NO usar en una red con salida a Internet.
#
#  Instalacion del archivo (Windows):
#    Copiar como  C:\Program Files\mosquitto\mosquitto.conf
#  Instalacion del archivo (Linux):
#    Copiar como  /etc/mosquitto/conf.d/itlm.conf
# ============================================================

# ── 1. Escucha de red ───────────────────────────────────────
# Mosquitto 2.x NO escucha en la red por defecto: sin esta
# linea solo acepta conexiones desde 127.0.0.1 y las ESP32
# nunca se conectan.
listener 1883 0.0.0.0

# IMPORTANTE: no agregar la directiva "bind_address".
# Esta obsoleta y, combinada con "listener", intenta abrir el
# puerto dos veces -> el servicio no arranca con el error
# "Solo se permite un uso de cada direccion de socket".

# ── 2. Autenticacion ────────────────────────────────────────
# Modo A: se permiten clientes anonimos (sin usuario ni clave).
allow_anonymous true

# ── 3. Persistencia ─────────────────────────────────────────
# Conserva los mensajes "retained" (estado de los actuadores)
# aunque se reinicie el broker.
persistence true
persistence_location C:/ProgramData/mosquitto/
# En Linux:  persistence_location /var/lib/mosquitto/

# ── 4. Registro de sucesos (log) ────────────────────────────
# La carpeta debe ser ESCRIBIBLE. C:\Program Files\ NO lo es
# para el servicio: si se apunta el log alli, el servicio
# arranca y se detiene de inmediato.
log_dest file C:/ProgramData/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# ── 5. Limites ──────────────────────────────────────────────
max_queued_messages 1000
message_size_limit 262144
